<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarantulas — Interactive Field Guide</title><style>
:root{color-scheme:dark;--bg:#101d1e;--card:#203434;--gold:#e7b27a;--text:#f5f0e6;--muted:#b8c8c2}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}button{cursor:pointer}.slide{min-height:100vh;padding:clamp(24px,4vw,65px);display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 95% 5%,#2a4740 0,transparent 38%),var(--bg);border-left:9px solid var(--gold)}.eyebrow{font-size:clamp(12px,1.2vw,16px);letter-spacing:.22em;color:var(--gold);font-weight:750;text-transform:uppercase}h1{font-size:clamp(40px,5.2vw,76px);line-height:1.09;letter-spacing:-.04em;max-width:1100px;margin:2.6vh 0 3vh}main{flex:1;display:flex;align-items:center;gap:3vw;min-height:0}.content{background:var(--card);border:1px solid #406058;border-radius:24px;padding:clamp(24px,3.3vw,48px);font-size:clamp(19px,2.15vw,32px);line-height:1.56;max-height:64vh;overflow:auto;width:100%;max-width:1200px;box-shadow:0 25px 70px #0003}.diagram{width:58%;flex-shrink:0}.diagram svg{width:100%;height:auto;border-radius:17px}.anatomy .content,.wasp .content{font-size:clamp(17px,1.8vw,26px)}.anatomy main,.wasp main{align-items:center}.wasp-note{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:999px;background:#37261c;color:#ffd6ab;font-size:14px;font-weight:700;border:1px solid #8a6241}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding-top:17px}.nav{display:flex;gap:10px;align-items:center}button{background:#2c4942;border:1px solid #658278;border-radius:12px;color:white;font-size:16px;padding:11px 17px}button:hover,button:focus-visible{background:#447565;outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}.progress{height:5px;width:100%;position:absolute;top:0;left:0;background:#304a43}.progress span{height:100%;background:var(--gold);display:block;transition:width .2s}.tag{display:inline-block;color:#201913;background:var(--gold);padding:6px 14px;border-radius:100px;font-size:14px;font-weight:700;margin-top:12px}.shortcuts{color:var(--muted)}@media(max-width:800px){body{overflow:auto}.slide{min-height:100dvh}.anatomy main,.wasp main{flex-direction:column}.diagram{width:100%;max-width:470px}.content{max-height:55vh;font-size:clamp(19px,4vw,26px)}.footer{flex-wrap:wrap}.shortcuts{display:none}}@media print{body{overflow:visible}.slide{height:100vh;page-break-after:always}button,.shortcuts{display:none}}

</style></head><body><section class="slide" id="slide" aria-live="polite"><div class="progress"><span id="bar"></span></div><div class="eyebrow">FIELD GUIDE / TARANTULAS</div><h1 id="heading"></h1><main id="main"><div class="content" id="content"></div></main><div class="footer"><div class="shortcuts">← → Navigate • F Fullscreen • Home / End</div><div class="nav"><button id="prev" aria-label="Previous slide">← Back</button><span id="counter"></span><button id="next" aria-label="Next slide">Next →</button><button id="full" aria-label="Toggle fullscreen">⛶</button></div></div></section><script>
const slides=[["TARANTULAS", "Meet the giant, hairy spiders that are fascinating—not just frightening.", "hero"], ["What kind of animal?", "Arthropods are invertebrates: animals without backbones, with segmented bodies and jointed legs. This enormous animal group includes insects and arachnids. Tarantulas are spiders in the arachnid class—not insects. Arachnids have eight legs and two main body regions: the cephalothorax and abdomen.", "classification"], ["Built like a tarantula", "Tarantulas are large, hairy spiders with eight eyes, eight walking legs, two pedipalps and downward-facing fangs. Their hairs may be brown, black or orange. Body length: about 2–5 inches. Leg span: up to 11–12 inches. Large species, such as the Goliath birdeater, can weigh roughly 4–6 ounces.", "stats"], ["Anatomy: the spider blueprint", "A tarantula has eight legs attached to the cephalothorax. The abdomen is the rear body region. Two pedipalps help sense and handle prey, while fangs deliver venom. Most tarantulas have eight small eyes.", "anatomy"], ["Life after dark", "Tarantulas are mostly nocturnal. In hot desert regions, they avoid the daytime sun by sheltering in silk-lined burrows and emerge at night to hunt insects and small vertebrates. They are often ambush hunters, using vibration-sensitive hairs to detect movement nearby.", "night"], ["Growing by molting", "A tarantula must periodically shed its hard outer exoskeleton to grow. During and after molting it is soft and vulnerable. Through later molts, some tarantulas can regenerate lost limbs.", "molt"], ["The great male migration", "Between roughly August and November in parts of the U.S. Southwest, mature males may leave burrows and travel in search of females. They can sometimes cover long distances—reportedly up to about 20 miles—so people may spot them crossing roads. Timing varies by region and species.", "migration"], ["Where tarantulas live", "They inhabit warm deserts, rainforests and grasslands around the world. Many live on the ground in underground, silk-lined dens; other species are arboreal and nest in trees. Tarantulas occur on every continent except Antarctica.", "habitat"], ["Webs without web traps", "Unlike familiar orb-weaving spiders, tarantulas generally do not spin typical food-catching webs. They use silk to line burrows, make retreats and perform other tasks. Sensitive body hairs help them pick up vibrations made by passing prey.", "silk"], ["A nighttime hunter", "Tarantulas eat large insects and, depending on their size, sometimes frogs, lizards or small rodents. They ambush prey, inject venom and release digestive fluids that break down tissues into a liquid they can consume.", "diet"], ["Defending themselves", "Most tarantulas would rather retreat than bite. Their bites can be painful, but most are not life-threatening to healthy humans; effects vary by species, and allergic reactions are possible. Many New World species also flick irritating barbed hairs from the abdomen. Predators include birds, lizards, snakes and tarantula hawk wasps.", "defense"], ["How long do they live?", "Male tarantulas often live around 5–12 years; females of some species may reach 25–40 years. Lifespans vary greatly by species and environment. Tarantulas live both in the wild and in captivity; many species are kept as pets.", "lifespan"], ["Myth or fact?", "MYTH: Tarantulas are insects or just “bugs.” FACT: They are arachnids. MYTH: All tarantulas are aggressive monsters. FACT: Many are relatively docile and avoid confrontation. Their dramatic appearance helps explain their scary reputation in movies and popular culture.", "myths"], ["A worldwide spider family", "Tarantulas include nearly 200 genera and more than 1,000 described species. Diversity is especially high in Central and South America, Africa, Asia and Australia. In the continental United States, counts vary by taxonomy, but roughly 29 to more than 50 native species are reported, many in Aphonopelma.", "population"], ["Tarantulas in the United States", "Commonly reported in Arizona, Arkansas, California, Colorado, Kansas, Louisiana, Missouri, Nevada, New Mexico, Oklahoma, Texas and Utah, with occurrences in parts of Oregon, Nebraska and Florida. Many U.S. species favor warm, dry habitats.", "us"], ["The tarantula hawk wasp", "Even an arthropod predator has enemies. A female tarantula hawk wasp can paralyze a tarantula with a sting, drag it to a burrow and lay an egg on it. The wasp larva later feeds on the living, paralyzed spider—one of nature’s most surprising predator relationships.", "wasp"], ["Tarantula takeaway", "Eight legs. Two body regions. No backbone. Mostly nighttime hunters. Some spend decades growing and molting. Tarantulas are remarkable arachnids—not simply the frightening creatures of pop culture.", "end"], ["Sources & further reading", "American Museum of Natural History — “Ten Things to Know About Tarantulas” (amnh.org). Arizona-Sonora Desert Museum — “Tarantula Fact Sheet” (desertmuseum.org). CITES — “Identification of CITES-listed Tarantulas” (cites.org). Species totals, ranges and life spans are approximate and vary.", "sources"]];const anatomy="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1100\" height=\"690\" viewBox=\"0 0 1100 690\"><rect width=\"1100\" height=\"690\" rx=\"30\" fill=\"#141e20\"/><circle cx=\"552\" cy=\"339\" r=\"265\" fill=\"#253332\" opacity=\".7\"/><path d=\"M 457 257 Q 380 175 315 175 Q 210 159 185 93\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 257 Q 380 175 315 175 Q 210 159 185 93\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"315\" cy=\"175\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 304 Q 380 280 305 280 Q 210 264 178 190\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 304 Q 380 280 305 280 Q 210 264 178 190\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"305\" cy=\"280\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 365 Q 380 443 295 443 Q 210 459 171 510\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 365 Q 380 443 295 443 Q 210 459 171 510\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"295\" cy=\"443\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 402 Q 380 514 285 514 Q 210 530 164 596\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 402 Q 380 514 285 514 Q 210 530 164 596\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"285\" cy=\"514\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 257 Q 720 175 785 175 Q 890 159 915 93\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 257 Q 720 175 785 175 Q 890 159 915 93\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"785\" cy=\"175\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 304 Q 720 280 795 280 Q 890 264 922 190\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 304 Q 720 280 795 280 Q 890 264 922 190\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"795\" cy=\"280\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 365 Q 720 443 805 443 Q 890 459 929 510\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 365 Q 720 443 805 443 Q 890 459 929 510\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"805\" cy=\"443\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 402 Q 720 514 815 514 Q 890 530 936 596\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 402 Q 720 514 815 514 Q 890 530 936 596\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"815\" cy=\"514\" r=\"17\" fill=\"#d39a64\"/><ellipse cx=\"550\" cy=\"403\" rx=\"105\" ry=\"135\" fill=\"#76452f\" stroke=\"#cc9461\" stroke-width=\"9\"/><ellipse cx=\"550\" cy=\"245\" rx=\"84\" ry=\"92\" fill=\"#946241\" stroke=\"#d6a370\" stroke-width=\"10\"/><path d=\"M 525 183 Q 550 164 575 183\" stroke=\"#ddbd8f\" stroke-width=\"6\" fill=\"none\"/><circle cx=\"534\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"534\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"545\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"545\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"556\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"556\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"567\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"567\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><path d=\"M 513 200 Q 451 133 453 105\" stroke=\"#a96f45\" stroke-width=\"20\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M 530 169 l -14 -38\" stroke=\"#251613\" stroke-width=\"13\" stroke-linecap=\"round\"/><path d=\"M 587 200 Q 649 133 647 105\" stroke=\"#a96f45\" stroke-width=\"20\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M 570 169 l 14 -38\" stroke=\"#251613\" stroke-width=\"13\" stroke-linecap=\"round\"/><text x=\"700\" y=\"110\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">8 walking legs</text><text x=\"630\" y=\"466\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Abdomen</text><text x=\"630\" y=\"259\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Cephalothorax</text><text x=\"445\" y=\"74\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Pedipalps</text><text x=\"395\" y=\"184\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Eyes and fangs</text></svg>";const wasp="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 700\" role=\"img\" aria-label=\"Stylized side view of a tarantula hawk wasp with long orange wings, dark slender body, narrow waist, long legs and curved antennae\">\n<defs>\n <linearGradient id=\"wing\" x1=\"0\" y1=\"0\" x2=\".85\" y2=\"1\"><stop stop-color=\"#ffca74\"/><stop offset=\".45\" stop-color=\"#f48b34\"/><stop offset=\"1\" stop-color=\"#a93e17\"/></linearGradient>\n <linearGradient id=\"body\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop stop-color=\"#38556b\"/><stop offset=\".42\" stop-color=\"#142733\"/><stop offset=\"1\" stop-color=\"#080f19\"/></linearGradient>\n <linearGradient id=\"bg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#172b2b\"/><stop offset=\"1\" stop-color=\"#10191d\"/></linearGradient>\n</defs>\n<rect width=\"1100\" height=\"700\" rx=\"26\" fill=\"url(#bg)\"/>\n<ellipse cx=\"548\" cy=\"584\" rx=\"405\" ry=\"22\" fill=\"#000\" opacity=\".2\"/>\n<!-- Long, distinctly wasp-like orange wings, swept backward above the body -->\n<path d=\"M484 323 C523 235 654 113 957 87 C927 190 805 296 535 362 Z\" fill=\"url(#wing)\" stroke=\"#f8bc71\" stroke-width=\"6\" opacity=\".97\"/>\n<path d=\"M510 337 C600 252 765 216 960 227 C865 313 702 376 548 373 Z\" fill=\"#c45c22\" stroke=\"#f19a53\" stroke-width=\"5\" opacity=\".85\"/>\n<g fill=\"none\" stroke=\"#8d421d\" stroke-width=\"3\" opacity=\".65\">\n<path d=\"M497 334 Q685 205 935 103\"/><path d=\"M517 342 Q704 276 946 228\"/><path d=\"M580 280 Q645 225 668 141\"/><path d=\"M671 236 Q767 215 809 125\"/><path d=\"M590 339 Q741 328 844 274\"/>\n</g>\n<!-- 6 legs, slender and jointed, three on each side of the thorax -->\n<g fill=\"none\" stroke=\"#0b121b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M438 389 L386 473 L309 518 L264 579\" stroke-width=\"13\"/><path d=\"M470 405 L444 495 L421 541 L363 602\" stroke-width=\"14\"/><path d=\"M509 394 L553 485 L585 530 L574 608\" stroke-width=\"12\"/>\n<path d=\"M444 378 L367 423 L301 447 L243 497\" stroke-width=\"10\"/><path d=\"M480 395 L481 454 L462 506 L486 569\" stroke-width=\"10\"/><path d=\"M515 383 L596 444 L656 466 L692 533\" stroke-width=\"11\"/>\n</g>\n<g fill=\"#617181\"><circle cx=\"386\" cy=\"473\" r=\"8\"/><circle cx=\"444\" cy=\"495\" r=\"8\"/><circle cx=\"553\" cy=\"485\" r=\"8\"/><circle cx=\"367\" cy=\"423\" r=\"7\"/><circle cx=\"481\" cy=\"454\" r=\"7\"/><circle cx=\"596\" cy=\"444\" r=\"7\"/></g>\n<!-- Narrow wasp waist connects muscular thorax to pointed abdomen -->\n<path d=\"M529 368 Q568 355 609 365 Q651 378 687 383\" fill=\"none\" stroke=\"#0b121a\" stroke-width=\"25\" stroke-linecap=\"round\"/>\n<path d=\"M537 365 Q590 350 672 380\" fill=\"none\" stroke=\"#486176\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n<!-- Elongated, smoothly tapered abdomen, not a rounded bee abdomen -->\n<path d=\"M657 367 C735 336 871 356 927 392 C891 437 772 471 683 417 Q652 400 657 367 Z\" fill=\"url(#body)\" stroke=\"#557083\" stroke-width=\"6\"/>\n<path d=\"M709 364 Q717 400 707 430 M783 361 Q797 402 782 449 M855 374 Q860 408 844 437\" stroke=\"#4c6171\" stroke-width=\"4\" fill=\"none\" opacity=\".8\"/>\n<!-- female stinger, short and subtle -->\n<path d=\"M924 393 L961 392 L934 409 Z\" fill=\"#bf9070\" stroke=\"#ddad82\" stroke-width=\"2\"/>\n<!-- thorax -->\n<path d=\"M399 345 C416 307 499 292 539 333 Q558 365 536 408 Q513 438 448 427 Q403 415 399 345 Z\" fill=\"url(#body)\" stroke=\"#627688\" stroke-width=\"7\"/>\n<path d=\"M430 326 Q475 309 520 337\" stroke=\"#6c8796\" stroke-width=\"6\" opacity=\".65\" fill=\"none\"/>\n<!-- head, modestly sized and clearly separated -->\n<path d=\"M392 346 C369 328 326 334 306 363 Q292 391 319 411 Q356 423 394 400 Z\" fill=\"url(#body)\" stroke=\"#5b7383\" stroke-width=\"6\"/>\n<circle cx=\"326\" cy=\"369\" r=\"8\" fill=\"#a9d8e8\"/><circle cx=\"327\" cy=\"369\" r=\"3.3\" fill=\"#12121a\"/>\n<path d=\"M311 401 L297 418 L315 411\" fill=\"#111923\"/>\n<!-- two long hooked antennae reach forward -->\n<g fill=\"none\" stroke=\"#111923\" stroke-width=\"10\" stroke-linecap=\"round\"><path d=\"M321 354 C272 328 248 283 261 227 Q268 198 286 195\"/><path d=\"M311 358 C263 346 215 323 199 287 Q187 264 201 245\"/></g>\n<!-- restrained labels, readable on large displays -->\n<g fill=\"#f7e4c4\" font-family=\"Arial,sans-serif\" font-size=\"27\" font-weight=\"bold\"><text x=\"762\" y=\"67\">Orange wings</text><text x=\"660\" y=\"558\">Long, narrow abdomen</text><text x=\"125\" y=\"170\">Curved antennae</text></g>\n<g fill=\"none\" stroke=\"#e7b27a\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M818 76 L830 131\"/><path d=\"M747 529 L797 454\"/><path d=\"M239 181 L259 225\"/></g>\n<text x=\"550\" y=\"656\" fill=\"#afc4bd\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"21\">Stylized side view \u00b7 original educational illustration</text>\n</svg>";let at=0;const el=id=>document.getElementById(id);function show(n){at=Math.max(0,Math.min(slides.length-1,n));const [title,body,kind]=slides[at];el('heading').textContent=title;el('content').textContent=body;el('slide').className='slide '+kind;
if(kind==='myths'){
  const entries=[
    ['Tarantulas are insects.','MYTH — Tarantulas are arachnids, not insects. They have eight legs and two main body regions.'],
    ['All tarantulas are aggressive.','MYTH — Many tarantulas are relatively docile and prefer to retreat rather than confront a threat.'],
    ['Tarantulas can be kept as pets.','FACT — Some tarantula species are popular pets, although they remain wild animals and require specialized care.'],
    ['A tarantula’s scary appearance tells you how dangerous it is.','MYTH — Their large size and hairy look can be intimidating, but appearance alone does not predict danger.']
  ];
  const content=el('content');content.replaceChildren();
  const intro=document.createElement('p');intro.className='myth-intro';intro.textContent='Read each statement. Decide: myth or fact? Tap a card to reveal the answer.';content.appendChild(intro);
  const grid=document.createElement('div');grid.className='myth-grid';content.appendChild(grid);
  entries.forEach(([claim,answer],idx)=>{
    const card=document.createElement('button');card.type='button';card.className='myth-card';card.setAttribute('aria-expanded','false');card.setAttribute('aria-label',`Statement ${idx+1}: ${claim} Tap to reveal answer`);
    function paint(revealed){card.replaceChildren();const title=document.createElement('strong');title.textContent=revealed?'REVEALED':'STATEMENT '+(idx+1);const text=document.createElement('span');text.textContent=revealed?answer:claim;const hint=document.createElement('span');hint.className='hint';hint.textContent=revealed?'Tap to show statement again':'Tap to reveal →';card.append(title,text,hint);card.classList.toggle('revealed',revealed);card.setAttribute('aria-expanded',String(revealed));}
    paint(false);card.addEventListener('click',()=>paint(!card.classList.contains('revealed')));grid.appendChild(card);
  });
}
document.querySelector('.diagram')?.remove();if(kind==='anatomy'||kind==='wasp'){const d=document.createElement('div');d.className='diagram';d.innerHTML=kind==='anatomy'?anatomy:wasp;el('main').appendChild(d);if(kind==='wasp'){const note=document.createElement('div');note.className='wasp-note';note.textContent='Original SVG illustration';el('content').appendChild(note)}}el('bar').style.width=(at+1)/slides.length*100+'%';el('counter').textContent=(at+1)+' / '+slides.length;el('prev').disabled=at===0;el('next').disabled=at===slides.length-1;history.replaceState(null,'','#slide-'+(at+1));}el('prev').onclick=()=>show(at-1);el('next').onclick=()=>show(at+1);el('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key===' '&&(e.target?.closest?.('.myth-card')))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(at+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(at-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)el('full').click()});show(Number(location.hash.replace('#slide-',''))-1||0);
