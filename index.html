<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarantulas — Interactive Field Guide</title><style>
:root{color-scheme:dark;--bg:#101d1e;--card:#203434;--gold:#e7b27a;--text:#f5f0e6;--muted:#b8c8c2}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}button{cursor:pointer}.slide{min-height:100vh;padding:clamp(24px,4vw,65px);display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 95% 5%,#2a4740 0,transparent 38%),var(--bg);border-left:9px solid var(--gold)}.eyebrow{font-size:clamp(12px,1.2vw,16px);letter-spacing:.22em;color:var(--gold);font-weight:750;text-transform:uppercase}h1{font-size:clamp(40px,5.2vw,76px);line-height:1.09;letter-spacing:-.04em;max-width:1100px;margin:2.6vh 0 3vh}main{flex:1;display:flex;align-items:center;gap:3vw;min-height:0}.content{background:var(--card);border:1px solid #406058;border-radius:24px;padding:clamp(24px,3.3vw,48px);font-size:clamp(19px,2.15vw,32px);line-height:1.56;max-height:64vh;overflow:auto;width:100%;max-width:1200px;box-shadow:0 25px 70px #0003}.diagram{width:58%;flex-shrink:0}.diagram svg{width:100%;height:auto;border-radius:17px}.anatomy .content{font-size:clamp(17px,1.8vw,26px)}.anatomy main{align-items:center}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding-top:17px}.nav{display:flex;gap:10px;align-items:center}button{background:#2c4942;border:1px solid #658278;border-radius:12px;color:white;font-size:16px;padding:11px 17px}button:hover,button:focus-visible{background:#447565;outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}.progress{height:5px;width:100%;position:absolute;top:0;left:0;background:#304a43}.progress span{height:100%;background:var(--gold);display:block;transition:width .2s}.tag{display:inline-block;color:#201913;background:var(--gold);padding:6px 14px;border-radius:100px;font-size:14px;font-weight:700;margin-top:12px}.shortcuts{color:va </style></head><body><section class="slide" id="slide" aria-live="polite"><div class="progress"><span id="bar"></span></div><div class="eyebrow">FIELD GUIDE / TARANTULAS</div><h1 id="heading"></h1><main id="main"><div class="content" id="content"></div></main><div class="footer"><div class="shortcuts">← → Navigate • F Fullscreen • Home / End</div><div class="nav"><button id="prev" aria-label="Previous slide">← Back</button><span id="counter"></span><button id="next" aria-label="Next slide">Next →</button><button id="full" aria-label="Toggle fullscreen">⛶</button></div></div></section><script>
const slides=[["TARANTULAS", "Meet the giant, hairy spiders that are fascinating—not just frightening.", "hero"], ["What kind of animal?", "Arthropods are invertebrates: animals without backbones, with segmented bodies and jointed legs. This enormous animal group includes insects and arachnids. Tarantulas are spiders in the arachnid class—not insects. Arachnids have eight legs and two main body regions: the cephalothorax and abdomen.", "classification"], ["Built like a tarantula", "Tarantulas are large, hairy spiders with eight eyes, eight walking legs, two pedipalps and downward-facing fangs. Their hairs may be brown, black or orange. Body length: about 2–5 inches. Leg span: up to 11–12 inches. Large species, such as the Goliath birdeater, can weigh roughly 4–6 ounces.", "stats"], ["Anatomy: the spider blueprint", "A tarantula has eight legs attached to the cephalothorax. The abdomen is the rear body region. Two pedipalps help sense and handle prey, while fangs deliver venom. Most tarantulas have eight small eyes.", "anatomy"], ["Life after dark", "Tarantulas are mostly nocturnal. In hot desert regions, they avoid the daytime sun by sheltering in silk-lined burrows and emerge at night to hunt insects and small vertebrates. They are often ambush hunters, using vibration-sensitive hairs to detect movement nearby.", "night"], ["Growing by molting", "A tarantula must periodically shed its hard outer exoskeleton to grow. During and after molting it is soft and vulnerable. Through later molts, some tarantulas can regenerate lost limbs.", "molt"], ["The great male migration", "Between roughly August and November in parts of the U.S. Southwest, mature males may leave burrows and travel in search of females. They can sometimes cover long distances—reportedly up to about 20 miles—so people may spot them crossing roads. Timing varies by region and species.", "migration"], ["Where tarantulas live", "They inhabit warm deserts, rainforests and grasslands around the world. Many live on the ground in underground, silk-lined dens; other species are arboreal and nest in trees. Tarantulas occur on every continent except Antarctica.", "habitat"], ["Webs without web traps", "Unlike familiar orb-weaving spiders, tarantulas generally do not spin typical food-catching webs. They use silk to line burrows, make retreats and perform other tasks. Sensitive body hairs help them pick up vibrations made by passing prey.", "silk"], ["A nighttime hunter", "Tarantulas eat large insects and, depending on their size, sometimes frogs, lizards or small rodents. They ambush prey, inject venom and release digestive fluids that break down tissues into a liquid they can consume.", "diet"], ["Defending themselves", "Most tarantulas would rather retreat than bite. Their bites can be painful, but most are not life-threatening to healthy humans; effects vary by species, and allergic reactions are possible. Many New World species also flick irritating barbed hairs from the abdomen. Predators include birds, lizards, snakes and tarantula hawk wasps.", "defense"], ["How long do they live?", "Male tarantulas often live around 5–12 years; females of some species may reach 25–40 years. Lifespans vary greatly by species and environment. Tarantulas live both in the wild and in captivity; many species are kept as pets.", "lifespan"], ["Myth or fact?", "MYTH: Tarantulas are insects or just “bugs.” FACT: They are arachnids. MYTH: All tarantulas are aggressive monsters. FACT: Many are relatively docile and avoid confrontation. Their dramatic appearance helps explain their scary reputation in movies and popular culture.", "myths"], ["A worldwide spider family", "Tarantulas include nearly 200 genera and more than 1,000 described species. Diversity is especially high in Central and South America, Africa, Asia and Australia. In the continental United States, counts vary by taxonomy, but roughly 29 to more than 50 native species are reported, many in Aphonopelma.", "population"], ["Tarantulas in the United States", "Commonly reported in Arizona, Arkansas, California, Colorado, Kansas, Louisiana, Missouri, Nevada, New Mexico, Oklahoma, Texas and Utah, with occurrences in parts of Oregon, Nebraska and Florida. Many U.S. species favor warm, dry habitats.", "us"], ["The tarantula hawk wasp", "Even an arthropod predator has enemies. A female tarantula hawk wasp can paralyze a tarantula with a sting, drag it to a burrow and lay an egg on it. The wasp larva later feeds on the living, paralyzed spider—one of nature’s most surprising predator relationships.", "wasp"], ["Tarantula takeaway", "Eight legs. Two body regions. No backbone. Mostly nighttime hunters. Some spend decades growing and molting. Tarantulas are remarkable arachnids—not simply the frightening creatures of pop culture.", "end"], ["Sources & further reading", "American Museum of Natural History — “Ten Things to Know About Tarantulas” (amnh.org). Arizona-Sonora Desert Museum — “Tarantula Fact Sheet” (desertmuseum.org). CITES — “Identification of CITES-listed Tarantulas” (cites.org). Species totals, ranges and life spans are approximate and vary.", "sources"]];const anatomy="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1100\" height=\"690\" viewBox=\"0 0 1100 690\"><rect width=\"1100\" height=\"690\" rx=\"30\" fill=\"#141e20\"/><circle cx=\"552\" cy=\"339\" r=\"265\" fill=\"#253332\" opacity=\".7\"/><path d=\"M 457 257 Q 380 175 315 175 Q 210 159 185 93\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 257 Q 380 175 315 175 Q 210 159 185 93\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"315\" cy=\"175\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 304 Q 380 280 305 280 Q 210 264 178 190\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 304 Q 380 280 305 280 Q 210 264 178 190\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"305\" cy=\"280\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 365 Q 380 443 295 443 Q 210 459 171 510\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 365 Q 380 443 295 443 Q 210 459 171 510\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"295\" cy=\"443\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 457 402 Q 380 514 285 514 Q 210 530 164 596\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 457 402 Q 380 514 285 514 Q 210 530 164 596\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"285\" cy=\"514\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 257 Q 720 175 785 175 Q 890 159 915 93\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 257 Q 720 175 785 175 Q 890 159 915 93\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"785\" cy=\"175\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 304 Q 720 280 795 280 Q 890 264 922 190\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 304 Q 720 280 795 280 Q 890 264 922 190\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"795\" cy=\"280\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 365 Q 720 443 805 443 Q 890 459 929 510\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 365 Q 720 443 805 443 Q 890 459 929 510\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"805\" cy=\"443\" r=\"17\" fill=\"#d39a64\"/><path d=\"M 643 402 Q 720 514 815 514 Q 890 530 936 596\" fill=\"none\" stroke=\"#251613\" stroke-width=\"41\" stroke-linecap=\"round\"/><path d=\"M 643 402 Q 720 514 815 514 Q 890 530 936 596\" fill=\"none\" stroke=\"#a66a43\" stroke-width=\"29\" stroke-linecap=\"round\"/><circle cx=\"815\" cy=\"514\" r=\"17\" fill=\"#d39a64\"/><ellipse cx=\"550\" cy=\"403\" rx=\"105\" ry=\"135\" fill=\"#76452f\" stroke=\"#cc9461\" stroke-width=\"9\"/><ellipse cx=\"550\" cy=\"245\" rx=\"84\" ry=\"92\" fill=\"#946241\" stroke=\"#d6a370\" stroke-width=\"10\"/><path d=\"M 525 183 Q 550 164 575 183\" stroke=\"#ddbd8f\" stroke-width=\"6\" fill=\"none\"/><circle cx=\"534\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"534\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"545\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"545\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"556\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"556\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"567\" cy=\"200\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><circle cx=\"567\" cy=\"213\" r=\"4.5\" fill=\"#0c0b0b\" stroke=\"#eee0ae\" stroke-width=\"1.5\"/><path d=\"M 513 200 Q 451 133 453 105\" stroke=\"#a96f45\" stroke-width=\"20\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M 530 169 l -14 -38\" stroke=\"#251613\" stroke-width=\"13\" stroke-linecap=\"round\"/><path d=\"M 587 200 Q 649 133 647 105\" stroke=\"#a96f45\" stroke-width=\"20\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M 570 169 l 14 -38\" stroke=\"#251613\" stroke-width=\"13\" stroke-linecap=\"round\"/><text x=\"700\" y=\"110\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">8 walking legs</text><text x=\"630\" y=\"466\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Abdomen</text><text x=\"630\" y=\"259\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Cephalothorax</text><text x=\"445\" y=\"74\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Pedipalps</text><text x=\"395\" y=\"184\" fill=\"#f7e4c4\" font-size=\"27\" font-family=\"Arial\" font-weight=\"bold\">Eyes and fangs</text></svg>";let at=0;const el=id=>document.getElementById(id);function show(n){at=Math.max(0,Math.min(slides.length-1,n));const [title,body,kind]=slides[at];el('heading').textContent=title;el('content').textContent=body;el('slide').className='slide '+kind;document.querySelector('.diagram')?.remove();if(kind==='anatomy'){const d=document.createElement('div');d.className='diagram';d.innerHTML=anatomy;el('main').appendChild(d)}el('bar').style.width=(at+1)/slides.length*100+'%';el('counter').textContent=(at+1)+' / '+slides.length;el('prev').disabled=at===0;el('next').disabled=at===slides.length-1;history.replaceState(null,'','#slide-'+(at+1));}el('prev').onclick=()=>show(at-1);el('next').onclick=()=>show(at+1);el('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(at+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(at-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)el('full').click()});show(Number(location.hash.replace('#slide-',''))-1||0);
